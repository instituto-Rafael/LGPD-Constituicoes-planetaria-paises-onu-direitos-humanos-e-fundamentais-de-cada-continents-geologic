name: Robotics Information Governance

on:
  pull_request:
    paths:
      - "docs/ROBOTICS_INFORMATION_GOVERNANCE_FIRST_QUESTION.md"
      - "data/robotics_information_governance_v1.json"
      - "indices/robotics_information_governance.md"
      - "tests/test_robotics_information_governance.py"
      - ".github/workflows/robotics-information-governance.yml"
  push:
    paths:
      - "docs/ROBOTICS_INFORMATION_GOVERNANCE_FIRST_QUESTION.md"
      - "data/robotics_information_governance_v1.json"
      - "indices/robotics_information_governance.md"
      - "tests/test_robotics_information_governance.py"
      - ".github/workflows/robotics-information-governance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: python -m json.tool data/robotics_information_governance_v1.json >/dev/null

      - name: Run zero-dependency governance tests
        run: python -m unittest tests.test_robotics_information_governance -v
