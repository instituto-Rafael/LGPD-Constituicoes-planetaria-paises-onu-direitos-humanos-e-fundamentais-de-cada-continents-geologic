name: Robotics Information Governance

on:
  pull_request:
    paths:
      - "docs/ROBOTICS_INFORMATION_GOVERNANCE_FIRST_QUESTION.md"
      - "docs/ROBOTICS_MAPA_NORMATIVE_CROSSWALK_V2.md"
      - "data/robotics_information_governance_v1.json"
      - "data/robotics_normative_crosswalk_v2.json"
      - "indices/robotics_information_governance.md"
      - "tests/test_robotics_information_governance.py"
      - "tests/test_robotics_normative_crosswalk.py"
      - ".github/workflows/robotics-information-governance.yml"
  push:
    paths:
      - "docs/ROBOTICS_INFORMATION_GOVERNANCE_FIRST_QUESTION.md"
      - "docs/ROBOTICS_MAPA_NORMATIVE_CROSSWALK_V2.md"
      - "data/robotics_information_governance_v1.json"
      - "data/robotics_normative_crosswalk_v2.json"
      - "indices/robotics_information_governance.md"
      - "tests/test_robotics_information_governance.py"
      - "tests/test_robotics_normative_crosswalk.py"
      - ".github/workflows/robotics-information-governance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          python -m json.tool data/robotics_information_governance_v1.json >/dev/null
          python -m json.tool data/robotics_normative_crosswalk_v2.json >/dev/null

      - name: Run zero-dependency governance tests
        run: |
          python -m unittest tests.test_robotics_information_governance -v
          python -m unittest tests.test_robotics_normative_crosswalk -v
